
<div class="row" *ngIf="postsArr.length > 0; else noPosts">
  <div class="col-md-4 mb-4" *ngFor="let post of postsArr">
  <app-post-card [getPost]="post"></app-post-card>
    </div>
  </div>

 <ng-template #noPosts>
  <p class="alert alert-info">
   <strong> No Post !!! </strong> 
  </p>
 </ng-template>
