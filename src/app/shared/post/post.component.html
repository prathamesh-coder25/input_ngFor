
<mat-card class="example-card h-100 d-flex flex-column justify-content-between">
    <mat-card-title>{{ getPost.title }}</mat-card-title>
    <mat-card-content>
        <p> {{getPost.body}} </p>
    </mat-card-content>
    <mat-card-actions class="d-flex justify-content-between">
        <button  mat-mini-fab color="primary"><mat-icon>edit</mat-icon></button>
        <button  mat-mini-fab color="warn"><mat-icon>delete</mat-icon></button>
    </mat-card-actions>
</mat-card>
